resources:
  jobs:
    nyc_taxi_job:
      name: nyc_taxi_pipeline

      # Paramètres globaux du Job
      parameters:
        - name: periode
          default: "202601"

        - name: taxi_type
          default: "yellow"

      tasks:
        - task_key: bronze
          job_cluster_key: nyc_cluster
          notebook_task:
            notebook_path: ../src/bronze/uber_bronze.py
            base_parameters:
              periode: "{{job.parameters.periode}}"
              taxi_type: "{{job.parameters.taxi_type}}"

        - task_key: silver
          depends_on:
            - task_key: bronze

          job_cluster_key: nyc_cluster
          notebook_task:
            notebook_path: ../src/silver/uber_silver.py

            base_parameters:
              periode: "{{job.parameters.periode}}"
              taxi_type: "{{job.parameters.taxi_type}}"


        - task_key: gold
          depends_on:
            - task_key: silver

          job_cluster_key: nyc_cluster

          notebook_task:
            notebook_path: ../src/gold/uber_gold.py

            base_parameters:
              periode: "{{job.parameters.periode}}"
              taxi_type: "{{job.parameters.taxi_type}}"

      job_clusters:
        - job_cluster_key: nyc_cluster
          new_cluster:
            spark_version: "17.0.x-scala2.13"
            node_type_id: "Standard_DS3_v2"
            num_workers: 2