resources:
  jobs:
    nyc_taxi_job:
      name: nyc_taxi_pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/bronze/uber_bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze

          notebook_task:
            notebook_path: ../src/silver/uber_silver.py

        - task_key: gold

          depends_on:
            - task_key: silver

          notebook_task:
            notebook_path: ../src/gold/uber_gold.py

      job_clusters:
        - job_cluster_key: nyc_cluster
          new_cluster:
            spark_version: 17.0.x-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 2