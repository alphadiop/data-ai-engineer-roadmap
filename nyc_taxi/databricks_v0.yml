bundle:
  name: nyc-taxi

resources:
  jobs:
    nyc_pipeline:
      name: NYC Taxi Pipeline

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: src/bronze/uber_bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: src/silver/uber_silver.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: src/gold/uber_gold.py